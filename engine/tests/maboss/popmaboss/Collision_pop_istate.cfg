// Unnormalised weights 1 : 3, i.e. probabilities 1/4 and 3/4. A cell that
// starts with A = 1 stays alone, so P([{A:1}]) ends near 3/4 + 1/4 * 1/3 = 5/6.
[A].pop_istate = 1 [{[0]:1}], 3 [{[1]:1}];
discrete_time = 0;
use_physrandgen = FALSE;
seed_pseudorandom = 100;
sample_count = 10000;
max_time = 3;
time_tick = 0.1;
thread_count = 1;
